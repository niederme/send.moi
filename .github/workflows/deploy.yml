name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy wiring
        run: |
          python3 scripts/check-deploy.py
          python3 scripts/check-github-deploy.py

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 ssh.suckahs.org >> ~/.ssh/known_hosts

      - name: Deploy
        run: DEPLOY_IDENTITY_FILE="$HOME/.ssh/deploy_key" ./scripts/deploy.sh
